# Cloudflare Workers configuration for Tienda POS
name = "tienda-pos-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Account details
account_id = "b85347650ec6de9ad5b2873c3389d0e6"

# Variables de nivel superior (el deploy usa --env="", así que aplican estas).
# APP_URL: base del front Next.js al que el cron del respaldo a Drive llama
# POST {APP_URL}/api/backup/run. Sin esto, runDriveBackups() se omite.
[vars]
APP_URL = "https://posib.dev"
# Issuers de Clerk aceptados (comparación exacta; ver isAllowedClerkIssuer).
# Prod (clerk.posib.dev) + instancia de desarrollo que usan `pnpm dev` y la E2E.
CLERK_JWT_ISSUERS = "https://clerk.posib.dev,https://excited-foal-90.clerk.accounts.dev"

# Environment variables
[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }

# KV namespace para metadata de tenants (mapeo de clerk_user_id -> db_name)
[[kv_namespaces]]
binding = "TENANTS"
id = "2003e0a6ed1e4f7cb1033c7e9249d7dd"
preview_id = "0ff63456aa9f45049dbefc3cf4f0cc01"

# D1 database para gestión de tenants
[[d1_databases]]
binding = "TENANTS_DB"
database_name = "tenants-manager"
database_id = "e6998ff4-2167-43a1-b0e4-1420849a08d7"

# D1 database compartida (Opción B - con tenant_id)
[[d1_databases]]
binding = "DB"
database_name = "tienda-pos-shared"
database_id = "9d71dfad-5c36-4dac-9c4a-b0716ebe3d20"

# R2 bucket para facturas en PDF
[[r2_buckets]]
binding = "FACTURAS_BUCKET"
bucket_name = "posib-facturas"

# CORS configuration
# [site]
# bucket = ""

# Rutas de la API (comentadas por ahora, se configuran después del deploy)
# [[routes]]
# pattern = "api.tudominio.com/*"
# zone_name = "tudominio.com"

# Cron Triggers para automatización de emails
# Docs: https://developers.cloudflare.com/workers/configuration/cron-triggers/
#
# Un único cron que dispara CADA HORA. El handler `scheduled` en src/index.ts
# decide qué tarea ejecutar según la hora (UTC):
#   - Cada hora:        reportes diarios + carritos abandonados
#   - Horas pares:      alertas de stock (hour % 2 === 0)
#   - 8 AM UTC:         recordatorios de deudas
#   - 9 AM UTC:         recordatorios de suscripción
# Consolidado de 5 crons a 1 para respetar el límite de 5 crons/cuenta del plan
# gratuito de Cloudflare Workers (compartido entre todos los Workers).
[triggers]
crons = [
  "0 * * * *"     # Cada hora en punto — el código reparte las tareas por hora
]
